{% extends "base.html" %}
{% block title %}비밀번호변경 · 주택관리 시스템{% endblock %}
{% block content %}

<div class="legacy-sukum-panel card">
  <div class="legacy-sukum-caption">
    <span class="caption-title">비밀번호 변경</span>
  </div>
  <form method="post" class="legacy-sukum-body" autocomplete="off">
    <div class="ls-row">
      <label class="ls-lab">사용자 ID</label>
      <div class="ls-val">
        <input type="text" class="ls-box ls-ro" readonly
               value="{{ sabun }}" tabindex="-1">
        <span class="ls-building" style="margin-left:6px"><strong>{{ s_name }}</strong></span>
      </div>
    </div>
    <div class="ls-row">
      <label class="ls-lab star">기존비밀번호</label>
      <div class="ls-val">
        <input type="password" name="old_password" class="ls-box" required
               maxlength="10" autocomplete="current-password" autofocus>
      </div>
    </div>
    <div class="ls-row">
      <label class="ls-lab star">새비밀번호</label>
      <div class="ls-val">
        <input type="password" name="new_password" class="ls-box" required
               maxlength="10" autocomplete="new-password"
               placeholder="10자 이내">
      </div>
    </div>
    <div class="ls-row">
      <label class="ls-lab star">비밀번호확인</label>
      <div class="ls-val">
        <input type="password" name="new_password2" class="ls-box" required
               maxlength="10" autocomplete="new-password"
               placeholder="새 비밀번호 재입력">
      </div>
    </div>
    <p class="panel-inline-note">본인 계정만 변경 가능합니다. 다른 사용자 비번은 사용자관리에서 수정하세요.</p>
    <div class="ls-actions">
      <button type="submit" class="btn">변경</button>
      <a class="btn secondary" href="{{ url_for('home') }}">취소</a>
    </div>
  </form>
</div>
{% endblock %}
