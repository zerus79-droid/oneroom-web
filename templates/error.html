{% extends "base.html" %}

{% block title %}오류 발생{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 50px auto; padding: 30px; background: #f8f9fa; border-radius: 8px; text-align: center;">
    <h1 style="color: #dc3545; font-size: 72px; margin: 0 0 20px 0;">{{ error_code }}</h1>
    <h2 style="color: #333; margin: 0 0 15px 0;">오류가 발생했습니다</h2>
    <p style="color: #666; font-size: 16px; margin: 0 0 30px 0;">{{ error_message }}</p>
    
    <div style="margin-top: 30px;">
        <a href="{{ url_for('home') }}" style="display: inline-block; padding: 12px 24px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; margin-right: 10px;">
            홈으로 이동
        </a>
        <a href="javascript:history.back()" style="display: inline-block; padding: 12px 24px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px;">
            이전 페이지
        </a>
    </div>
    
    {% if error_code == 500 %}
    <p style="color: #999; font-size: 14px; margin-top: 30px;">
        문제가 지속되면 관리자에게 문의해주세요.
    </p>
    {% endif %}
</div>
{% endblock %}
